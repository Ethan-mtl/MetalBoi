name: CI Probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: probe network
        run: |
          java -version
          echo "--- fabricmc ---"; curl -s -o /dev/null -w "%{http_code}\n" https://maven.fabricmc.net/
          echo "--- minecraft libs ---"; curl -s -o /dev/null -w "%{http_code}\n" https://libraries.minecraft.net/
          echo "--- central ---"; curl -s -o /dev/null -w "%{http_code}\n" https://repo.maven.apache.org/maven2/
          echo "--- modrinth ---"; curl -s -o /dev/null -w "%{http_code}\n" https://api.modrinth.com/maven/
          echo "--- loader versions ---"
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -6
          echo "--- yarn 1.21.11 ---"
          curl -s "https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml" | grep -o '<version>1\.21\.11[^<]*</version>' | tail -5
          echo "--- loom ---"
          curl -s -o /dev/null -w "%{http_code}\n" https://maven.fabricmc.net/net/fabricmc/fabric-loom/
