name: Recon

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Warm Loom cache (download + remap Minecraft, no Sodium dep)
        run: ./gradlew --no-daemon --stacktrace build -Pmetalboi.sodium= || true

      - name: Run recon round 2
        run: bash ci/recon2.sh

      - name: Commit recon output back to the branch
        run: |
          git config user.name "MetalBoi CI"
          git config user.email "ci@metalboi.local"
          git add -f ci-out
          if git diff --cached --quiet; then
            echo "No recon changes to commit"
          else
            git commit -m "ci: recon round 2 (decompiled MC sources + javap)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
